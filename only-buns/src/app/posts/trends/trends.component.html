<div class="trends-container">
  <h1>Trendovi na mreži</h1>
  
  <div class="trends-section">
    <h2>Popularne teme danas</h2>
    <div class="trend-list">
      <div class="trend-item" *ngFor="let trend of trends">
        <span class="trend-rank">#{{trend.rank}}</span>
        <div class="trend-info">
          <h3>{{trend.topic}}</h3>
          <p>{{trend.posts}} objava</p>
        </div>
      </div>
    </div>
  </div>

  <div class="chart-placeholder">
    <p>Grafikon trendova (biće implementiran)</p>
  </div>
</div>
