<div class="users-container">
  <!-- Loading state -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="loading-spinner"></div>
    <p>Loading users...</p>
  </div>

  <!-- No users found -->
  <div *ngIf="!isLoading && users.length === 0" class="no-users">
    <p>No users found.</p>
  </div>

  <!-- Users list -->
  <ng-container *ngIf="!isLoading">
    <div *ngFor="let user of users" class="user-card">
      <div class="profile-info">
        <!-- Placeholder for profile picture -->
        <div class="profile-pic"></div>
        <div class="text-info">
          <p class="username">{{ user?.username || 'N/A' }}</p>
          <p class="fullname">{{ user?.fullName || 'No name' }}</p>
        </div>
      </div>
      
      <div class="stats">
        <div class="stat-item">
          <span class="stat-number">{{ user?.postNumber || 0 }}</span>
          <span class="stat-label">posts</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">{{ user?.numberOfFollowers || 0 }}</span>
          <span class="stat-label">followers</span>
        </div>
        <div class="stat-item">
          <span class="stat-number">{{ user?.followsPeople || 0 }}</span>
          <span class="stat-label">following</span>
        </div>
      </div>
      
      <button 
        class="follow-btn"
        [ngClass]="{ 'following': isUserFollowed(user) }"
        (click)="followUser(user)"
        *ngIf="user && userId"
      >
        {{ isUserFollowed(user) ? 'Unfollow' : 'Follow' }}
      </button>
    </div>
  </ng-container>
</div>
